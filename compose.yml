# Note: The 'version' key is legacy and optional in the modern Compose Specification
services:
  jekyll:
    image: ruby:3.3
    working_dir: /site
    volumes:
      - .:/site
      - bundle_cache:/usr/local/bundle
    ports:
      - "4000:4000"
    command: >
      sh -lc "bundle install &&
      bundle exec jekyll serve --host 0.0.0.0"

volumes:
  bundle_cache:

